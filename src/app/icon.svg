  </style>
  <circle class="ring" cx="16" cy="16" r="11" fill="none" stroke-width="2.4" />
  <circle class="core" cx="16" cy="16" r="6" />
  <circle class="knockout accent" cx="23.8" cy="8.2" r="3.6" stroke-width="2.6" />
